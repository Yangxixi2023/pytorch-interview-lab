<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="desktop-mode" content="__DESKTOP_MODE__"><meta name="lab-token" content="__TOKEN__"><title>手撕实验室 · Python / PyTorch</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6feb'/%3E%3Cpath d='M12 9L5 16l7 7m8-14l7 7-7 7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="#"><span class="brand-icon">&lt;/&gt;</span>手撕实验室</a><nav><button id="bank-nav" class="active">题库</button><button id="practice-nav">练习工作台</button><button id="reference-nav">参考代码</button><button id="interview-nav">面试问答</button></nav><div class="header-right"><span id="progress">0 / 85 已完成</span><button id="theme" aria-label="切换主题">◐</button></div></header>
<main id="bank"><aside><p class="eyebrow">练习目录</p><div id="categories"></div><p class="eyebrow">难度</p><div id="difficulties"></div><div class="aside-note">Python + PyTorch<br>从公式到可运行的实现</div></aside><section class="bank-content"><div class="page-title"><div><p class="eyebrow">INTERVIEW PRACTICE</p><h1>模型与算法手撕题库</h1><p class="muted">模型 · 训练 · 推理 · 经典手撕</p></div><button id="resume" class="primary">继续练习 →</button></div><div class="searchbar"><input id="search" placeholder="搜索题目、文件名或知识点…" aria-label="搜索题目"><select id="status-filter" aria-label="状态筛选"><option value="all">全部状态</option><option value="new">未开始</option><option value="draft">练习中</option><option value="solved">已通过</option></select><span id="count"></span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>题目</th><th>分类</th><th>难度</th><th>状态</th><th>用时</th></tr></thead><tbody id="problem-list"></tbody></table><div id="empty" hidden>没有找到匹配的题目，试试其他关键词或筛选条件。</div></div></section></main>
<main id="workspace" hidden><div class="workspace-toolbar"><div><button id="back">← 题库</button><span id="current-title"></span></div><div class="actions"><span id="timer">00:00</span><button id="pause">暂停计时</button><button id="run">▷ 运行示例</button><button id="submit" class="primary">提交测试</button><button id="stop" class="danger" hidden>停止</button></div></div><div class="work-grid"><section class="statement pane"><div class="pane-tabs"><button class="selected" data-doc="statement">题目描述</button><button data-doc="cases">测试用例</button><button data-doc="history">提交记录</button></div><div id="document" class="document"></div></section><div class="divider" id="divider" role="separator" aria-label="调整题目与编辑器宽度" tabindex="0"></div><section class="coding"><div class="editor-pane pane"><div class="editor-toolbar"><span id="filename"></span><span class="muted">Python · PyTorch</span><button id="reset">重置</button><button id="download">下载代码</button><span id="saved">已保存</span></div><div id="editor"></div><div class="editor-footer"><span>Ctrl + Enter 运行 · Ctrl + Shift + Enter 提交</span><label>快照行号 <input id="breakpoints" placeholder="如 6, 9" aria-label="调试快照行号"></label></div></div><section class="console pane"><div class="pane-tabs"><button class="selected" data-console="result">测试结果</button><button data-console="stdout">输出 / 错误</button><button data-console="debug">自定义调试</button><button data-console="snapshots">变量快照</button><span id="run-status">等待运行</span></div><div id="console-content"></div></section></section></div></main>
<main id="library" hidden><aside class="library-sidebar"><h2 id="library-title"></h2><input id="library-search" aria-label="搜索学习内容" placeholder="搜索参考代码…"><select id="library-filter" aria-label="学习内容分类"></select><div id="library-menu"></div></aside><section id="library-content"></section></main>
<div id="toast" role="status" hidden></div><dialog id="answer-dialog"><div class="dialog-head"><h2>参考实现</h2><button id="close-answer">关闭</button></div><p class="muted">建议先独立完成，再对照代码和梯度检查结果。</p><div id="answer-code"></div></dialog><script type="module" src="/bundle.js"></script></body></html>
